[project]
name = "projectlint"
version = "0.0.0"
authors = [{ name = "Shish", email = "shish@shishnet.org" }]
description = "Project linter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-PyYAML",
]

[tool.setuptools]
py-modules = ["projectlint"]

[tool.pytest.ini_options]
addopts = "--cov --cov-report term-missing --cov-fail-under 95"

[tool.ruff]
line-length = 120

[tool.coverage.run]
source = ["projectlint"]

[tool.isort]
profile = "black"

[tool.mypy]
files = "projectlint/"
